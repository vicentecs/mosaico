<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0d0d">
  <title>Mosaico de Câmeras / URLs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0d0d0d;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ========== Tela de configuração ========== */
    #setup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: 20px 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      gap: 16px;
      overflow-y: auto;
    }
    #setup h1 {
      font-size: clamp(1.3rem, 5vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
    }
    #setup p {
      color: #999;
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
      text-align: center;
      max-width: 520px;
      line-height: 1.5;
      padding: 0 4px;
    }
    #urls {
      width: min(640px, 100%);
      height: min(240px, 36vh);
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #eee;
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 16px;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    #urls:focus {
      border-color: #3b82f6;
    }
    #urls::placeholder {
      color: #555;
    }
    #btn-visualizar {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 40px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      min-height: 48px;
      -webkit-appearance: none;
    }
    #btn-visualizar:hover {
      background: #1d4ed8;
    }
    #btn-visualizar:active {
      transform: scale(0.97);
    }
    #btn-visualizar:disabled {
      background: #444;
      cursor: not-allowed;
    }

    /* ========== Mosaico ========== */
    #grid {
      display: none;
      width: 100%;
      height: 100%;
      height: 100dvh;
      gap: 2px;
      background: #111;
      overflow: hidden;
    }

    /* Modo lista (mobile): 1 por linha, scroll vertical, 16:9 */
    #grid.mode-list {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      gap: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .cell {
      position: relative;
      background: #000;
      overflow: hidden;
    }

    /* Desktop / grade: célula preenche o espaço da grid */
    #grid:not(.mode-list) .cell {
      width: 100%;
      height: 100%;
    }

    /* Mobile lista: força proporção 16:9 sem distorcer */
    #grid.mode-list .cell {
      width: 100%;
      flex: 0 0 auto;
      aspect-ratio: 16 / 9;
    }

    .cell iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: block;
    }

    .cell .label {
      position: absolute;
      left: 6px;
      bottom: 5px;
      color: #fff;
      font-size: clamp(10px, 2.8vw, 14px);
      text-shadow: 0 0 4px #000, 0 0 4px #000;
      z-index: 2;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 2px 6px;
      border-radius: 4px;
      max-width: calc(100% - 12px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell .offline {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f55;
      font-size: clamp(12px, 3.5vw, 18px);
      background: rgba(0,0,0,0.65);
      z-index: 3;
      text-align: center;
      padding: 8px;
    }

    /* Botão voltar */
    #btn-voltar {
      display: none;
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 100;
      background: rgba(30,30,30,0.9);
      color: #eee;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s;
      min-height: 44px;
      min-width: 44px;
      -webkit-appearance: none;
    }
    #btn-voltar:active {
      background: rgba(60,60,60,0.95);
    }

    /* ========== Mobile / Portrait (setup) ========== */
    @media (max-width: 768px), (orientation: portrait) and (max-width: 1024px) {
      #setup {
        padding: 16px 12px;
        gap: 14px;
      }
      #urls {
        height: min(220px, 32vh);
        font-size: 16px;
      }
      #btn-visualizar {
        width: min(100%, 320px);
        padding: 14px 24px;
      }
      .cell .label {
        font-size: clamp(9px, 2.6vw, 12px);
        left: 4px;
        bottom: 4px;
        padding: 1px 5px;
      }
    }

    @media (max-width: 380px) {
      #setup h1 {
        font-size: 1.25rem;
      }
      #setup p {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <!-- Tela inicial -->
  <div id="setup">
    <h1>Mosaico de URLs</h1>
    <p>
      Cole uma URL por linha. Links do YouTube (live, watch, youtu.be) são convertidos automaticamente para o formato embed.
      Clique em <strong>Visualizar</strong> para abrir o mosaico.
    </p>
    <textarea id="urls" placeholder="https://youtube.com/live/KZHc71aKcxY
https://youtu.be/RSJTQ45gVFs
https://www.youtube.com/watch?v=uhc8L79Xgw8
https://exemplo.com/outra-pagina"></textarea>
    <button id="btn-visualizar">Visualizar</button>
  </div>

  <!-- Grade do mosaico -->
  <div id="grid"></div>
  <button id="btn-voltar">← Voltar</button>

  <script>
  (function () {
    const MAX_SLOTS = 16;

    // Presets desktop / landscape: [colunas, linhas]
    const PRESETS = {
      1: [1, 1], 2: [2, 1], 3: [2, 2], 4: [2, 2],
      5: [3, 2], 6: [3, 2], 7: [3, 3], 8: [3, 3], 9: [3, 3],
      10: [4, 3], 11: [4, 3], 12: [4, 3],
      13: [4, 4], 14: [4, 4], 15: [4, 4], 16: [4, 4]
    };

    const setupEl   = document.getElementById('setup');
    const gridEl    = document.getElementById('grid');
    const urlsEl    = document.getElementById('urls');
    const btnVis    = document.getElementById('btn-visualizar');
    const btnVoltar = document.getElementById('btn-voltar');

    let listaAtual = [];
    let modoCopa = false;   // true quando aberto com ?COPA

    function isPortrait() {
      return window.innerHeight > window.innerWidth;
    }

    function isMobile() {
      return window.innerWidth <= 768 ||
             /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    /** Lista vertical (1 por linha) apenas em telas realmente pequenas */
    function usarModoLista() {
      // Só ativa lista se a largura for menor que 600px (celular em portrait)
      // Telas normais, tablets e landscape continuam em mosaico
      return window.innerWidth < 600;
    }

    function calcularGrade(n) {
      if (PRESETS[n]) return PRESETS[n];
      const cols = Math.ceil(Math.sqrt(n));
      const rows = Math.ceil(n / cols);
      return [cols, rows];
    }

    function normalizarUrl(url) {
      const patterns = [
        /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i
      ];
      for (const re of patterns) {
        const m = url.match(re);
        if (m && m[1]) {
          // vq=large tenta forçar 480p (YouTube pode ignorar conforme conexão/dispositivo)
          return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&vq=large`;
        }
      }
      return url;
    }

    function limparGrade() {
      gridEl.querySelectorAll('iframe').forEach(f => {
        f.src = 'about:blank';
        f.remove();
      });
      gridEl.innerHTML = '';
    }

    function montarGrade(lista) {
      listaAtual = lista;
      const n = Math.min(lista.length, MAX_SLOTS);
      const modoLista = usarModoLista();

      limparGrade();
      gridEl.classList.toggle('mode-list', modoLista);

      if (modoLista) {
        // Lista vertical: 1 coluna, cada player com 16:9
        gridEl.style.display = 'flex';
        gridEl.style.gridTemplateColumns = '';
        gridEl.style.gridTemplateRows = '';
      } else {
        // Grade clássica (desktop / landscape)
        const [cols, rows] = calcularGrade(n);
        gridEl.style.display = 'grid';
        gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        gridEl.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;
      }

      for (let i = 0; i < n; i++) {
        const url = lista[i];
        const cell = document.createElement('div');
        cell.className = 'cell';

        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('playsinline', '');
        iframe.setAttribute('webkit-playsinline', '');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-top-navigation-by-user-activation');

        const label = document.createElement('div');
        label.className = 'label';
        let short = url.replace(/^https?:\/\//i, '');
        const maxLen = modoLista ? 42 : (isMobile() ? 28 : 40);
        if (short.length > maxLen) short = short.slice(0, maxLen - 1) + '…';
        label.textContent = `${i + 1} · ${short}`;

        cell.appendChild(iframe);
        cell.appendChild(label);
        gridEl.appendChild(cell);

        iframe.addEventListener('error', () => {
          if (!cell.querySelector('.offline')) {
            const badge = document.createElement('div');
            badge.className = 'offline';
            badge.textContent = 'Falha ao carregar';
            cell.appendChild(badge);
          }
        });
      }

      setupEl.style.display = 'none';
      btnVoltar.style.display = modoCopa ? 'none' : 'block';
    }

    function voltar() {
      limparGrade();
      listaAtual = [];
      gridEl.style.display = 'none';
      gridEl.classList.remove('mode-list');
      btnVoltar.style.display = 'none';
      setupEl.style.display = 'flex';
    }

    // Recria a grade quando a orientação / tamanho muda
    let resizeTimer;
    window.addEventListener('resize', () => {
      if (listaAtual.length === 0) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        montarGrade(listaAtual);
      }, 180);
    });

    window.addEventListener('orientationchange', () => {
      if (listaAtual.length === 0) return;
      setTimeout(() => montarGrade(listaAtual), 250);
    });

    btnVis.addEventListener('click', () => {
      const texto = urlsEl.value.trim();
      if (!texto) {
        urlsEl.focus();
        return;
      }

      const lista = texto
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0 && /^https?:\/\//i.test(l))
        .map(normalizarUrl);

      if (lista.length === 0) {
        alert('Nenhuma URL válida encontrada.\nUse uma URL por linha começando com http:// ou https://');
        return;
      }

      if (lista.length > MAX_SLOTS) {
        alert(`Serão exibidas apenas as primeiras ${MAX_SLOTS} URLs.`);
      }

      montarGrade(lista);
    });

    btnVoltar.addEventListener('click', voltar);

    urlsEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        btnVis.click();
      }
    });

    // ========== Modo COPA (?COPA na URL) ==========
    // Até 22/08/2026 → lista 1
    // A partir de 23/08/2026 → lista 2
    (function initCopa() {
      const params = new URLSearchParams(window.location.search);
      const temCopa = [...params.keys()].some(k => k.toUpperCase() === 'COPA');
      if (!temCopa) return;
      modoCopa = true;

      const LISTA_ATE_22 = [
        'https://youtube.com/live/KZHc71aKcxY',
        'https://youtube.com/live/RSJTQ45gVFs',
        'https://youtube.com/live/uhc8L79Xgw8',
        'https://youtube.com/live/IXwrV41SLDI'
      ];

      const LISTA_A_PARTIR_23 = [
        'https://youtube.com/live/7uJ1bGMBfY8',
        'https://youtube.com/live/AIDJfRpir-E',
        'https://youtube.com/live/YdZCGZ1JLto',
        'https://youtube.com/live/E70Xm7q5Kj0'
      ];

      // Data de corte: 23/08/2026 00:00 (horário local do navegador)
      const agora = new Date();
      const corte = new Date(2026, 7, 23); // mês é 0-indexed → 7 = agosto

      const listaCopa = (agora >= corte) ? LISTA_A_PARTIR_23 : LISTA_ATE_22;

      // Preenche o textarea (caso o usuário volte) e abre o mosaico
      urlsEl.value = listaCopa.join('\n');
      const listaNormalizada = listaCopa.map(normalizarUrl);
      montarGrade(listaNormalizada);
    })();
  })();
  </script>
</body>
</html>
